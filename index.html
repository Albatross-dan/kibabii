<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      // Prevent Vite HMR WebSocket disconnect loops from triggering automatic page reloads
      (function() {
        if (typeof window !== 'undefined') {
          const OriginalWebSocket = window.WebSocket;
          if (OriginalWebSocket) {
            window.WebSocket = function(url, protocols) {
              const urlStr = String(url || '');
              const isViteHmr = protocols === 'vite-hmr' || protocols === 'vite-ping' || urlStr.includes('token=') || urlStr.includes('/@vite');
              if (isViteHmr) {
                const listeners = {};
                const dummySocket = {
                  readyState: 1, // OPEN
                  url: urlStr,
                  protocol: protocols || '',
                  extensions: '',
                  binaryType: 'blob',
                  bufferedAmount: 0,
                  onopen: null,
                  onclose: null,
                  onerror: null,
                  onmessage: null,
                  addEventListener: function(type, listener) {
                    if (!listeners[type]) listeners[type] = [];
                    listeners[type].push(listener);
                    if (type === 'open') {
                      setTimeout(() => {
                        try {
                          if (dummySocket.onopen) dummySocket.onopen({ type: 'open', target: dummySocket });
                          listener({ type: 'open', target: dummySocket });
                        } catch (e) {}
                      }, 10);
                    }
                  },
                  removeEventListener: function(type, listener) {
                    if (listeners[type]) {
                      listeners[type] = listeners[type].filter(function(l) { return l !== listener; });
                    }
                  },
                  dispatchEvent: function() { return true; },
                  send: function() {},
                  close: function() {}
                };
                return dummySocket;
              }
              return new OriginalWebSocket(url, protocols);
            };
            window.WebSocket.prototype = OriginalWebSocket.prototype;
            window.WebSocket.CONNECTING = 0;
            window.WebSocket.OPEN = 1;
            window.WebSocket.CLOSING = 2;
            window.WebSocket.CLOSED = 3;
          }
        }
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/logo-icon.svg" />
    <link rel="apple-touch-icon" href="/logo-icon.svg" />
    <title>KibabuiMart</title>
    <meta name="description" content="Premium university marketplace for Kibabii University students and staff to buy and sell items." />
    <meta property="og:title" content="KibabuiMart" />
    <meta property="og:description" content="Premium university marketplace for Kibabii University students and staff to buy and sell items." />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
